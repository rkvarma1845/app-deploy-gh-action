name: Deploy Test

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - qa
      - dev

jobs:
  deploy:
    runs-on: ubuntu-latest

    environment:
      name: ${{ github.ref_name == 'main' && 'prod' || github.ref_name }}

    env:
      BRANCH_NAME: ${{ github.ref_name }}
      ENV_NAME: ${{ github.ref_name == 'main' && 'prod' || github.ref_name }}

    steps:
      - uses: actions/checkout@v4

      - name: Print branch and environment
        run: |
          echo "Executed branch : $BRANCH_NAME"
          echo "Environment     : $ENV_NAME"
          echo "Environment     : ${{ vars.env }}"

      - name: Add to run summary
        run: |
          echo "### Deployment info" >> $GITHUB_STEP_SUMMARY
          echo "- Branch: \`$BRANCH_NAME\`" >> $GITHUB_STEP_SUMMARY
          echo "- Environment: \`$ENV_NAME\`" >> $GITHUB_STEP_SUMMARY